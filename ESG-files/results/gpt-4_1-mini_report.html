<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG Evaluation Report</title>
<!-- prettier-ignore -->
<style>:root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface2: #f0f2f5;
    --border: #e0e4ea;
    --text: #1a1d27;
    --text-dim: #6b7280;
    --green: #16a34a;
    --green-bg: rgba(22, 163, 74, 0.08);
    --red: #dc2626;
    --red-bg: rgba(220, 38, 38, 0.06);
    --yellow: #d97706;
    --yellow-bg: rgba(217, 119, 6, 0.08);
    --blue: #2563eb;
    --blue-bg: rgba(37, 99, 235, 0.06);
    --purple: #7c3aed;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem;
}

h1 {
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
}

.subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 2rem;
}

.metrics-bar {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
}

.metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.75rem;
    min-width: 200px;
    flex: 1;
}

.metric-card .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 0.25rem;
}

.metric-card .value {
    font-size: 2rem;
    font-weight: 700;
}

.metric-card .value.good {
    color: var(--green);
}

.metric-card .value.warn {
    color: var(--yellow);
}

.metric-card .value.bad {
    color: var(--red);
}

.metric-card .bar {
    margin-top: 0.5rem;
    height: 6px;
    border-radius: 3px;
    background: var(--surface2);
    overflow: hidden;
}

.metric-card .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
}

.scenario-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
}

.tab-btn {
    padding: 0.5rem 1.25rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.2s;
}

.tab-btn:hover {
    border-color: var(--blue);
    color: var(--text);
}

.tab-btn.active {
    background: var(--blue-bg);
    border-color: var(--blue);
    color: var(--blue);
}

.scenario-panel {
    display: none;
}

.scenario-panel.active {
    display: block;
}

.scenario-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.scenario-header h2 {
    font-size: 1.2rem;
    font-weight: 600;
}

.scenario-header .doc {
    color: var(--text-dim);
    font-size: 0.8rem;
    background: var(--surface2);
    padding: 0.25rem 0.75rem;
    border-radius: 6px;
}

.badge {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
}

.badge-match {
    background: var(--green-bg);
    color: var(--green);
}

.badge-diff {
    background: var(--red-bg);
    color: var(--red);
}

.badge-missing {
    background: var(--yellow-bg);
    color: var(--yellow);
}

.badge-extra {
    background: var(--blue-bg);
    color: var(--blue);
}

.category-section {
    margin-bottom: 1.5rem;
}

.category-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--purple);
    margin-bottom: 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
}

.key-issue-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 1rem;
    overflow: hidden;
}

.key-issue-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1rem;
    cursor: pointer;
    user-select: none;
    background: var(--surface);
    transition: background 0.15s;
}

.key-issue-header:hover {
    background: var(--surface2);
}

.key-issue-header .ki-title {
    font-weight: 600;
    font-size: 0.9rem;
}

.key-issue-header .ki-stats {
    display: flex;
    gap: 0.5rem;
    align-items: center;
}

.chevron {
    width: 18px;
    height: 18px;
    transition: transform 0.2s;
    color: var(--text-dim);
}

.key-issue-block.open .chevron {
    transform: rotate(180deg);
}

.key-issue-body {
    display: none;
    padding: 0 1rem 1rem;
}

.key-issue-block.open .key-issue-body {
    display: block;
}

.comp-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
    table-layout: fixed;
}

.comp-table th {
    text-align: left;
    padding: 0.5rem 0.75rem;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
}

.comp-table td {
    padding: 0.5rem 0.75rem;
    vertical-align: top;
    border-bottom: 1px solid var(--border);
    word-wrap: break-word;
    overflow-wrap: break-word;
}

.comp-table tr:last-child td {
    border-bottom: none;
}

.comp-table .cell-match {
    color: var(--green);
}

.comp-table .cell-diff {
    color: var(--red);
}

.comp-table .cell-missing {
    color: var(--yellow);
    font-style: italic;
}

.legend {
    display: flex;
    gap: 1.25rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    font-size: 0.8rem;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
}

.legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
}

.summary-stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
}

.summary-stat {
    background: var(--surface2);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    text-align: center;
}

.summary-stat .num {
    font-size: 1.4rem;
    font-weight: 700;
}

.summary-stat .lbl {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

a {
    color: var(--blue);
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.studio-link {
    display: inline-block;
    margin-bottom: 2rem;
    font-size: 0.85rem;
}

/* ── Method-level tabs (top navigation) ── */
.method-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 2rem;
    border-bottom: 2px solid var(--border);
}

.method-tab-btn {
    padding: 0.75rem 1.75rem;
    border: none;
    border-bottom: 3px solid transparent;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: all 0.2s;
    margin-bottom: -2px;
}

.method-tab-btn:hover {
    color: var(--text);
    border-bottom-color: var(--border);
}

.method-tab-btn.active {
    color: var(--blue);
    border-bottom-color: var(--blue);
}

.method-panel {
    display: none;
}

.method-panel.active {
    display: block;
}

@media (max-width: 768px) {
    body {
        padding: 1rem;
    }

    .metric-card {
        min-width: 140px;
    }

    .method-tab-btn {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
    }
}</style>
</head>

// ── Helpers ──
function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
function pct(v) { return (v * 100).toFixed(1) + '%'; }
function colorClass(v) { return v >= 0.9 ? 'good' : v >= 0.6 ? 'warn' : 'bad'; }
function barColor(v) { return v >= 0.9 ? 'var(--green)' : v >= 0.6 ? 'var(--yellow)' : 'var(--red)'; }

function scenarioLabel(s) {
  if (s === 'B1') return 'Scenario 1 - Risk Assessment';
  if (s === 'B7') return 'Scenario 2 - Description and Practice';
  if (s.startsWith('C')) return 'Scenario 3 - Controversies';
  return s;
}

// Return only keys whose values are arrays (skip schema fields like $schema, $defs, etc.)
function arrayCats(obj) {
  return Object.keys(obj).filter(k => Array.isArray(obj[k]));
}

function detectType(row) {
  const exp = row['inputs.expected'];
  const cats = arrayCats(exp);
  if (!cats.length) return 'unknown';
  const first = exp[cats[0]];
  if (!first || !first.length) return 'unknown';
  const item = first[0];
  if (item['RISK EXPOSURE ASSESSMENT']) return 'risk_assessment';
  if (item['Description & Practice']) return 'description_practice';
  if (item['cases']) return 'controversies';
  return 'unknown';
}

    if (exp||act) {
      const expCC = exp?exp.case_count:{}, actCC = act?act.case_count:{};
      const sevs = ['Very Severe','Severe','Moderate','Minor'];
      let ccRows = '';
      sevs.forEach(s => {
        const ev=(expCC||{})[s]??'\u2014', av=(actCC||{})[s]??'\u2014';
        const match = String(ev)===String(av);
        const cls = match?'cell-match':'cell-diff';
        ccRows += `<tr><td>${esc(s)}</td><td class="${cls}">${esc(ev)}</td><td class="${cls}">${esc(av)}</td>
          <td>${match?'<span class="badge badge-match">Match</span>':'<span class="badge badge-diff">Diff</span>'}</td></tr>`;
      });
      caseCountHtml = `<h4 style="font-size:0.8rem;color:var(--text-dim);margin:0.75rem 0 0.5rem;text-transform:uppercase;letter-spacing:0.05em">Case Counts</h4>
        <table class="comp-table"><thead><tr><th>Severity</th><th>Expected</th><th>Extracted</th><th>Status</th></tr></thead><tbody>${ccRows}</tbody></table>`;
    }
    // Cases
    const expCases = exp?(exp.cases||[]):[], actCases = act?(act.cases||[]):[];
    let casesHtml = '';
    expCases.forEach(ec => {
      const ac = actCases.find(a=>a.Case&&ec.Case&&(a.Case===ec.Case||a.Case.substring(0,50)===ec.Case.substring(0,50)));
      const caseMatch = !!ac;
      casesHtml += `<div style="margin-top:0.75rem;padding:0.5rem;background:var(--surface2);border-radius:6px;margin-bottom:0.25rem">
        <div style="font-size:0.78rem;font-weight:600;margin-bottom:0.5rem;color:${caseMatch?'var(--text)':'var(--yellow)'}">
          ${!caseMatch?'<span class="badge badge-missing" style="margin-right:0.4rem">Not Found</span>':''}${esc(ec.Case)}</div>
        <table class="comp-table"><thead><tr><th>Field</th><th>Expected</th><th>Extracted</th><th>Status</th></tr></thead><tbody>`;
      ['Severity','Score','Flag','Role','Status'].forEach(f => {
        const ev=ec[f], av=ac?ac[f]:undefined;
        const match = String(ev||'').trim()===String(av||'').trim();
        const cls = !caseMatch?'cell-missing':match?'cell-match':'cell-diff';
        casesHtml += `<tr><td>${esc(f)}</td><td class="${cls}">${esc(ev??'\u2014')}</td><td class="${cls}">${esc(av??'\u2014')}</td>
          <td>${!caseMatch?'':match?'<span class="badge badge-match">Match</span>':'<span class="badge badge-diff">Diff</span>'}</td></tr>`;
      });
      const expDates=ec.Dates||{}, actDates=(ac||{}).Dates||{};
      Object.keys(expDates).forEach(dk => {
        const ev=expDates[dk], av=actDates[dk];
        const match = String(ev||'').trim()===String(av||'').trim();
        const cls = !caseMatch?'cell-missing':match?'cell-match':'cell-diff';
        casesHtml += `<tr><td style="padding-left:1rem">Dates > ${esc(dk)}</td><td class="${cls}">${esc(ev??'\u2014')}</td><td class="${cls}">${esc(av??'\u2014')}</td>
          <td>${!caseMatch?'':match?'<span class="badge badge-match">Match</span>':'<span class="badge badge-diff">Diff</span>'}</td></tr>`;
      });
      casesHtml += `</tbody></table></div>`;
    });
    // Extra cases
    actCases.forEach(ac => {
      const found = expCases.find(ec=>ec.Case&&ac.Case&&(ec.Case===ac.Case||ec.Case.substring(0,50)===ac.Case.substring(0,50)));
      if (!found) {
        casesHtml += `<div style="margin-top:0.75rem;padding:0.5rem;background:var(--surface2);border-radius:6px;margin-bottom:0.25rem">
          <div style="font-size:0.78rem;font-weight:600;margin-bottom:0.5rem;color:var(--blue)">
            <span class="badge badge-extra" style="margin-right:0.4rem">Extra Case</span>${esc(ac.Case)}</div>
          <table class="comp-table"><thead><tr><th>Field</th><th>Expected</th><th>Extracted</th><th>Status</th></tr></thead><tbody>`;
        ['Severity','Score','Flag','Role','Status'].forEach(f => {
          casesHtml += `<tr><td>${esc(f)}</td><td class="cell-missing">\u2014</td><td style="color:var(--blue)">${esc(ac[f]??'\u2014')}</td>
            <td><span class="badge badge-extra">Extra</span></td></tr>`;
        });
        const actDates=ac.Dates||{};
        Object.keys(actDates).forEach(dk => {
          casesHtml += `<tr><td style="padding-left:1rem">Dates > ${esc(dk)}</td><td class="cell-missing">\u2014</td><td style="color:var(--blue)">${esc(actDates[dk]??'\u2014')}</td>
            <td><span class="badge badge-extra">Extra</span></td></tr>`;
        });
        casesHtml += `</tbody></table></div>`;
      }
    });
    const isExtra=!exp, isMissing=!act;
    const issueStatus = isExtra?'badge-extra':isMissing?'badge-missing':'badge-match';
    const statusLabel = isExtra?'Extra Key Issue':isMissing?'Missing':`${(exp.cases||[]).length} case(s)`;
    html += `<div class="key-issue-block">
      <div class="key-issue-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="ki-title">${esc(key)}</span>
        <span class="ki-stats"><span class="badge ${issueStatus}">${statusLabel}</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="key-issue-body">
        ${caseCountHtml}
        <h4 style="font-size:0.8rem;color:var(--text-dim);margin:1rem 0 0.5rem;text-transform:uppercase;letter-spacing:0.05em">Cases Detail</h4>
        ${casesHtml}
      </div></div>`;
  });
  return html;
}

// ── Compute diff stats ──
function computeStats(row) {
  const type = detectType(row);
  const exp = row['inputs.expected'], act = row['inputs.actual'];
  const categories = [...new Set([...arrayCats(exp),...arrayCats(act)])];
  let totalFields=0, matchedFields=0, missingItems=0, extraItems=0;
  categories.forEach(cat => {
    const expItems=Array.isArray(exp[cat])?exp[cat]:[], actItems=Array.isArray(act[cat])?act[cat]:[];
    const expKeys=expItems.map(i=>i['KEY ISSUE']), actKeys=actItems.map(i=>i['KEY ISSUE']);
    actKeys.forEach(k=>{if(!expKeys.includes(k))extraItems++;});
    expKeys.forEach(k=>{if(!actKeys.includes(k))missingItems++;});
    if (type==='risk_assessment') {
      expItems.forEach(ei=>{
        const ai=actItems.find(a=>a['KEY ISSUE']===ei['KEY ISSUE']);
        ['RISK EXPOSURE ASSESSMENT','RISK MANAGEMENT ASSESSMENT'].forEach(ra=>{
          ['Company','Industry'].forEach(sub=>{totalFields++;if(ai&&String((ei[ra]||{})[sub]||'').trim()===String((ai[ra]||{})[sub]||'').trim())matchedFields++;});
        });
      });
    } else if (type==='description_practice') {
      expItems.forEach(ei=>{
        const ai=actItems.find(a=>a['KEY ISSUE']===ei['KEY ISSUE']);
        const expPr=ei['Description & Practice']||[], actPr=ai?(ai['Description & Practice']||[]):[];
        expPr.forEach(ep=>{
          const ap=actPr.find(a=>a.Description===ep.Description)||actPr.find(a=>a.Description&&ep.Description&&a.Description.toLowerCase().includes(ep.Description.toLowerCase().substring(0,30)));
          ['Company Practice','Best Practice'].forEach(f=>{totalFields++;if(ap&&String(ep[f]||'').trim()===String(ap[f]||'').trim())matchedFields++;});
          const sk=ep['Practices Score']!==undefined?'Practices Score':'Practice Score';
          const ask=ap?(ap['Practices Score']!==undefined?'Practices Score':'Practice Score'):sk;
          totalFields++;if(ap&&String(ep[sk]||'').trim()===String(ap[ask]||'').trim())matchedFields++;
          if(!ap)missingItems++;
        });
      });
    } else if (type==='controversies') {
      expItems.forEach(ei=>{
        const ai=actItems.find(a=>a['KEY ISSUE']===ei['KEY ISSUE']);
        ['Very Severe','Severe','Moderate','Minor'].forEach(s=>{totalFields++;if(ai&&String((ei.case_count||{})[s]||'')===String((ai.case_count||{})[s]||''))matchedFields++;});
        (ei.cases||[]).forEach(ec=>{
          const acase=ai?(ai.cases||[]).find(a=>a.Case&&ec.Case&&(a.Case===ec.Case||a.Case.substring(0,50)===ec.Case.substring(0,50))):null;
          ['Severity','Score','Flag','Role','Status'].forEach(f=>{totalFields++;if(acase&&String(ec[f]||'').trim()===String(acase[f]||'').trim())matchedFields++;});
        });
      });
    }
  });
  return {totalFields, matchedFields, missingItems, extraItems};
}

// ── Render a single method's content ──
function renderMethodContent(methodData, prefix) {
  const rows = methodData.rows;
  const overallHitRate = methodData.metrics['hit_rate.hit_rate'];
  const runName = methodData.run || '';

  let html = '';
  if (runName) html += `<p style="font-size:0.8rem;color:var(--text-dim);margin-bottom:1rem">Run: ${esc(runName)}</p>`;

  // Metrics bar
  html += `<div class="metrics-bar"><div class="metric-card">
    <div class="label">Overall Hit Rate</div>
    <div class="value ${colorClass(overallHitRate)}">${pct(overallHitRate)}</div>
    <div class="bar"><div class="bar-fill" style="width:${overallHitRate*100}%;background:${barColor(overallHitRate)}"></div></div>
  </div>`;
  rows.forEach(r => {
    const hr = r['outputs.hit_rate.hit_rate'];
    html += `<div class="metric-card">
      <div class="label">${esc(scenarioLabel(r['inputs.scenario']))} Hit Rate</div>
      <div class="value ${colorClass(hr)}">${pct(hr)}</div>
      <div class="bar"><div class="bar-fill" style="width:${hr*100}%;background:${barColor(hr)}"></div></div>
    </div>`;
  });
  html += `<div class="metric-card"><div class="label">Scenarios</div>
    <div class="value" style="color:var(--blue)">${rows.length}</div></div></div>`;

  // Legend
  html += `<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Match</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Difference</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div> Missing in Extracted</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div> Extra in Extracted</div>
  </div>`;

  // Scenario tabs
  html += `<div class="scenario-tabs">`;
  rows.forEach((r,i) => {
    html += `<button class="tab-btn ${i===0?'active':''}" onclick="switchScenarioTab('${prefix}',${i})" id="${prefix}-stab-${i}">${esc(scenarioLabel(r['inputs.scenario']))}</button>`;
  });
  html += `</div>`;

  // Scenario panels
  rows.forEach((r,i) => {
    const type = detectType(r);
    const exp = r['inputs.expected'], act = r['inputs.actual'];
    const categories = [...new Set([...arrayCats(exp),...arrayCats(act)])];
    const stats = computeStats(r);
    html += `<div class="scenario-panel ${i===0?'active':''}" id="${prefix}-span-${i}">
      <div class="scenario-header"><h2>${esc(scenarioLabel(r['inputs.scenario']))}</h2><span class="doc">${esc(r['inputs.document'])}</span></div>
      <div class="summary-stats">
        <div class="summary-stat"><div class="num ${colorClass(r['outputs.hit_rate.hit_rate'])}">${pct(r['outputs.hit_rate.hit_rate'])}</div><div class="lbl">Hit Rate</div></div>
        <div class="summary-stat"><div class="num" style="color:var(--green)">${stats.matchedFields}</div><div class="lbl">Fields Matched</div></div>
        <div class="summary-stat"><div class="num" style="color:var(--text)">${stats.totalFields}</div><div class="lbl">Total Fields</div></div>
        <div class="summary-stat"><div class="num" style="color:var(--yellow)">${stats.missingItems}</div><div class="lbl">Missing</div></div>
        <div class="summary-stat"><div class="num" style="color:var(--blue)">${stats.extraItems}</div><div class="lbl">Extra</div></div>
      </div>`;
    categories.forEach(cat => {
      html += `<div class="category-section"><div class="category-title">${esc(cat)}</div>`;
      if (type==='risk_assessment') html += buildRiskAssessmentView(exp,act,cat);
      else if (type==='description_practice') html += buildDescPracticeView(exp,act,cat);
      else if (type==='controversies') html += buildControversiesView(exp,act,cat);
      html += `</div>`;
    });
    html += `</div>`;
  });

  return html;
}

// ── Main render ──
function render() {
  const app = document.getElementById('app');
  const methodNames = Object.keys(DATA.methods);

  // If only one method, skip method tabs
  if (methodNames.length === 1) {
    app.innerHTML = renderMethodContent(DATA.methods[methodNames[0]], 'm0');
    return;
  }

  // Method tabs (top-level)
  let html = `<div class="method-tabs">`;
  methodNames.forEach((name, i) => {
    html += `<button class="method-tab-btn ${i===0?'active':''}" onclick="switchMethodTab(${i})" id="mtab-${i}">${esc(name)}</button>`;
  });
  html += `</div>`;

  // Method panels
  methodNames.forEach((name, i) => {
    html += `<div class="method-panel ${i===0?'active':''}" id="mpanel-${i}">`;
    html += renderMethodContent(DATA.methods[name], 'm'+i);
    html += `</div>`;
  });

  app.innerHTML = html;
}

function switchMethodTab(idx) {
  document.querySelectorAll('.method-tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.method-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('mtab-'+idx).classList.add('active');
  document.getElementById('mpanel-'+idx).classList.add('active');
}

function switchScenarioTab(prefix, idx) {
  const container = document.getElementById(prefix+'-stab-0').parentElement.parentElement;
  container.querySelectorAll(`[id^="${prefix}-stab-"]`).forEach(b => b.classList.remove('active'));
  container.querySelectorAll(`[id^="${prefix}-span-"]`).forEach(p => p.classList.remove('active'));
  document.getElementById(prefix+'-stab-'+idx).classList.add('active');
  document.getElementById(prefix+'-span-'+idx).classList.add('active');
}

render();
</script>
