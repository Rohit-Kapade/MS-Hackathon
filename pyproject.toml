[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ten_k", "src/esg"]

[project]
name = "hackathon"
version = "0.1.0"
description = "PDF structured data extractor using Azure AI Foundry / Azure OpenAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2",
    "azure-ai-evaluation>=1.15.3",
    "azure-ai-projects==2.0.0",
    "azure-identity>=1.25.2",
    # OpenAI SDK
    "dash>=4.0.0",
    "openai>=2.24.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=6.6.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "openpyxl>=3.1.5",
    "pyright>=1.1.408",
    # Testing
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: tests that call Azure Foundry (require credentials and PDFs)",
]
